<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-trailbz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#2c1a4d"/>
    </linearGradient>
    <radialGradient id="astral-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#48cae4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-trailbz">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-trailbz)"/>
  <circle cx="200" cy="135" r="95" fill="url(#astral-glow)"/>
  
  <!-- Cosmic Railway Orbit Lines -->
  <ellipse cx="200" cy="135" rx="150" ry="55" fill="none" stroke="#48cae4" stroke-width="2" stroke-dasharray="16 8" transform="rotate(-18 200 135)"/>
  <ellipse cx="200" cy="135" rx="120" ry="40" fill="none" stroke="#ffd166" stroke-width="1.5" transform="rotate(25 200 135)"/>
  
  <!-- Astral Express Golden Ticket & Compass Star -->
  <g filter="url(#glow-trailbz)" transform="translate(200, 135)">
    <!-- 4-pointed Astral Star -->
    <polygon points="0,-55 12,-15 52,0 12,15 0,55 -12,15 -52,0 -12,-15" fill="#ffd166"/>
    <polygon points="0,-40 8,-10 38,0 8,10 0,40 -8,10 -38,0 -8,-10" fill="#ffffff"/>
    <circle cx="0" cy="0" r="7" fill="#ff6b6b"/>
  </g>
  
  <!-- Planetary Orbiters -->
  <circle cx="90" cy="90" r="10" fill="#48cae4" opacity="0.8" filter="url(#glow-trailbz)"/>
  <circle cx="310" cy="170" r="14" fill="#ffd166" opacity="0.8" filter="url(#glow-trailbz)"/>
  <circle cx="290" cy="70" r="4" fill="#ffffff" filter="url(#glow-trailbz)"/>
  
  <text x="200" y="260" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffd166" letter-spacing="3" text-anchor="middle">ASTRAL TRAILBLAZE</text>
</svg>