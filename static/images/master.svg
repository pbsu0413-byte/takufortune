<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-master" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24050d"/>
      <stop offset="50%" stop-color="#4a0e1c"/>
      <stop offset="100%" stop-color="#140817"/>
    </linearGradient>
    <radialGradient id="seal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1744" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#d50000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-master">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-master)"/>
  <circle cx="200" cy="135" r="95" fill="url(#seal-glow)"/>
  
  <!-- Magical Summoning Circle -->
  <g stroke="#ff5252" stroke-width="1.5" fill="none" opacity="0.7">
    <circle cx="200" cy="135" r="75"/>
    <circle cx="200" cy="135" r="65" stroke-dasharray="8 6"/>
    <!-- Outer Inscribed Octagram -->
    <polygon points="200,60 253,83 275,135 253,187 200,210 147,187 125,135 147,83"/>
    <polygon points="253,83 200,210 147,83 275,135 125,135 253,187 200,60 147,187"/>
  </g>
  
  <!-- Crimson Command Spell (令呪 - Command Seal) -->
  <g filter="url(#glow-master)" transform="translate(200, 135)">
    <!-- Top Feather -->
    <path d="M0,-45 C15,-30 20,-15 0,0 C-20,-15 -15,-30 0,-45 Z" fill="#ff1744"/>
    <!-- Left Wing -->
    <path d="M-15,-10 C-35,0 -40,25 -20,35 C-10,25 -5,5 -15,-10 Z" fill="#ff1744"/>
    <!-- Right Wing -->
    <path d="M15,-10 C35,0 40,25 20,35 C10,25 5,5 15,-10 Z" fill="#ff1744"/>
    <!-- Core Gem -->
    <circle cx="0" cy="10" r="5" fill="#ffffff"/>
  </g>
  
  <text x="200" y="260" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ff5252" letter-spacing="3" text-anchor="middle">HEROIC SPIRIT SUMMON</text>
</svg>