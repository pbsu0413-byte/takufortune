<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-nikke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a14"/>
      <stop offset="50%" stop-color="#3d122b"/>
      <stop offset="100%" stop-color="#0f0e1f"/>
    </linearGradient>
    <radialGradient id="neon-nikke" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2a6d" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#05d9e8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-nikke">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-nikke)"/>
  <circle cx="200" cy="140" r="110" fill="url(#neon-nikke)"/>
  
  <!-- Cyber Tactical Grid & Hexagons -->
  <g stroke="#ff2a6d" stroke-width="1" stroke-opacity="0.3" fill="none">
    <polygon points="200,60 240,83 240,129 200,152 160,129 160,83"/>
    <polygon points="120,106 160,129 160,175 120,198 80,175 80,129"/>
    <polygon points="280,106 320,129 320,175 280,198 240,175 240,129"/>
  </g>
  
  <!-- Tactical Commander Reticle & Crosshair -->
  <g filter="url(#glow-nikke)">
    <circle cx="200" cy="140" r="65" fill="none" stroke="#05d9e8" stroke-width="2" stroke-dasharray="25 15 45 15"/>
    <circle cx="200" cy="140" r="45" fill="none" stroke="#ff2a6d" stroke-width="2"/>
    <circle cx="200" cy="140" r="5" fill="#ff2a6d"/>
    <line x1="200" y1="65" x2="200" y2="85" stroke="#05d9e8" stroke-width="3"/>
    <line x1="200" y1="195" x2="200" y2="215" stroke="#05d9e8" stroke-width="3"/>
    <line x1="125" y1="140" x2="145" y2="140" stroke="#05d9e8" stroke-width="3"/>
    <line x1="255" y1="140" x2="275" y2="140" stroke="#05d9e8" stroke-width="3"/>
    
    <!-- Ammo & Cyber Wing Badges -->
    <path d="M170,180 L185,210 L165,225 Z" fill="#ff2a6d"/>
    <path d="M230,180 L215,210 L235,225 Z" fill="#ff2a6d"/>
  </g>
  
  <text x="200" y="260" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#05d9e8" letter-spacing="3" text-anchor="middle">TACTICAL COMMAND</text>
</svg>