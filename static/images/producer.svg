<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-producer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240c1d"/>
      <stop offset="50%" stop-color="#451438"/>
      <stop offset="100%" stop-color="#140924"/>
    </linearGradient>
    <radialGradient id="stage-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-producer">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-producer)"/>
  <circle cx="200" cy="135" r="95" fill="url(#stage-glow)"/>
  
  <!-- Spotlight Beams -->
  <polygon points="60,0 120,0 240,240 160,240" fill="#f43f5e" opacity="0.12"/>
  <polygon points="340,0 280,0 160,240 240,240" fill="#ec4899" opacity="0.12"/>
  
  <!-- 765Pro Angel Wing & Producer Star Badge -->
  <g filter="url(#glow-producer)" transform="translate(200, 130)">
    <!-- Angel Feather Wings -->
    <path d="M-10,-10 C-30,-40 -80,-30 -70,10 C-50,20 -25,10 -10,0 Z" fill="#ff70a6"/>
    <path d="M10,-10 C30,-40 80,-30 70,10 C50,20 25,10 10,0 Z" fill="#ff70a6"/>
    <!-- Producer 'P' Golden Crown Star -->
    <polygon points="0,-40 10,-15 36,-10 16,10 22,35 0,20 -22,35 -16,10 -36,-10 -10,-15" fill="#ffd166"/>
    <circle cx="0" cy="0" r="14" fill="#ffffff"/>
    <text x="0" y="6" font-family="'Black Han Sans', sans-serif" font-size="16" font-weight="900" fill="#ec4899" text-anchor="middle">P</text>
  </g>
  
  <!-- Musical Notes & Penlight Sparks -->
  <g fill="#ffd166" opacity="0.85" filter="url(#glow-producer)">
    <circle cx="90" cy="90" r="3"/>
    <circle cx="310" cy="90" r="3"/>
    <circle cx="120" cy="190" r="3"/>
    <circle cx="280" cy="190" r="3"/>
  </g>
  
  <text x="200" y="260" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ff70a6" letter-spacing="3" text-anchor="middle">765PRO PRODUCER</text>
</svg>