<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1609"/>
      <stop offset="50%" stop-color="#3d2c12"/>
      <stop offset="100%" stop-color="#12111a"/>
    </linearGradient>
    <radialGradient id="amber-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffa000" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#ff6f00" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-gf">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-gf)"/>
  <circle cx="200" cy="135" r="95" fill="url(#amber-glow)"/>
  
  <!-- Tactical Arsenal Cogwheel & Weapon Schematics -->
  <g stroke="#ffb300" stroke-width="1.5" fill="none" opacity="0.6">
    <circle cx="200" cy="135" r="70" stroke-dasharray="14 8"/>
    <circle cx="200" cy="135" r="50"/>
  </g>
  
  <!-- Crossed Bullet Cartridges & Wrench Symbol -->
  <g filter="url(#glow-gf)" transform="translate(200, 135)">
    <!-- Cartridge 1 -->
    <g transform="rotate(35)">
      <rect x="-6" y="-30" width="12" height="40" rx="2" fill="#ffb300"/>
      <polygon points="-6,-30 6,-30 0,-44" fill="#ffe082"/>
      <rect x="-7" y="10" width="14" height="4" fill="#ff8f00"/>
    </g>
    <!-- Cartridge 2 -->
    <g transform="rotate(-35)">
      <rect x="-6" y="-30" width="12" height="40" rx="2" fill="#ffb300"/>
      <polygon points="-6,-30 6,-30 0,-44" fill="#ffe082"/>
      <rect x="-7" y="10" width="14" height="4" fill="#ff8f00"/>
    </g>
    <!-- Center Shield -->
    <polygon points="0,-18 16,-6 10,18 0,26 -10,18 -16,-6" fill="#261c02" stroke="#ffe082" stroke-width="2"/>
    <polygon points="0,-8 6,-1 4,8 0,12 -4,8 -6,-1" fill="#ffa000"/>
  </g>
  
  <text x="200" y="260" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffb300" letter-spacing="3" text-anchor="middle">ARSENAL ARMORY</text>
</svg>