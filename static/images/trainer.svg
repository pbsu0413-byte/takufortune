<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-trainer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2b1d"/>
      <stop offset="50%" stop-color="#144d32"/>
      <stop offset="100%" stop-color="#1b1938"/>
    </linearGradient>
    <radialGradient id="turf-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2ecc71" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#ffcf5c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2ecc71" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-trainer">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-trainer)"/>
  <circle cx="200" cy="140" r="100" fill="url(#turf-glow)"/>
  
  <!-- Running Track Lines -->
  <ellipse cx="200" cy="240" rx="180" ry="60" fill="none" stroke="#2ecc71" stroke-width="2" stroke-opacity="0.4"/>
  <ellipse cx="200" cy="240" rx="140" ry="46" fill="none" stroke="#ffcf5c" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="10 6"/>
  <ellipse cx="200" cy="240" rx="100" ry="32" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <!-- Golden Horseshoe Emblem -->
  <g filter="url(#glow-trainer)" transform="translate(200, 110)">
    <path d="M-40,20 C-40,-35 40,-35 40,20 C30,20 22,12 22,-5 C22,-20 -22,-20 -22,-5 C-22,12 -30,20 -40,20 Z" fill="#ffcf5c" stroke="#fff" stroke-width="2"/>
    <!-- Horseshoe Studs -->
    <circle cx="-30" cy="-5" r="3" fill="#1b1938"/>
    <circle cx="-25" cy="-20" r="3" fill="#1b1938"/>
    <circle cx="-10" cy="-28" r="3" fill="#1b1938"/>
    <circle cx="10" cy="-28" r="3" fill="#1b1938"/>
    <circle cx="25" cy="-20" r="3" fill="#1b1938"/>
    <circle cx="30" cy="-5" r="3" fill="#1b1938"/>
  </g>
  
  <!-- Trainer Stopwatch & Clover -->
  <g transform="translate(200, 145)" filter="url(#glow-trainer)">
    <circle cx="0" cy="0" r="28" fill="#144d32" stroke="#ffcf5c" stroke-width="3"/>
    <rect x="-3" y="-35" width="6" height="8" fill="#ffcf5c" rx="2"/>
    <line x1="0" y1="0" x2="12" y2="-12" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="16" stroke="#ff6f9c" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3.5" fill="#ffcf5c"/>
  </g>
  
  <!-- Speed Lines & Victory Ribbon -->
  <path d="M50,110 L130,110 M30,130 L110,130 M270,110 L350,110 M290,130 L370,130" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <polygon points="70,50 90,80 50,80" fill="#2ecc71" opacity="0.8"/>
  <polygon points="330,50 350,80 310,80" fill="#ffcf5c" opacity="0.8"/>
</svg>