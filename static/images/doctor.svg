<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-doctor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05131a"/>
      <stop offset="50%" stop-color="#0a222e"/>
      <stop offset="100%" stop-color="#141e24"/>
    </linearGradient>
    <radialGradient id="originium-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#4facfe" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-doctor">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-doctor)"/>
  <circle cx="200" cy="135" r="95" fill="url(#originium-glow)"/>
  
  <!-- Rhodes Island / Chemical Research Hexagonal Nodes -->
  <g stroke="#00f2fe" stroke-width="1" stroke-opacity="0.4">
    <line x1="100" y1="100" x2="150" y2="70"/>
    <line x1="150" y1="70" x2="250" y2="70"/>
    <line x1="250" y1="70" x2="300" y2="100"/>
    <line x1="300" y1="100" x2="300" y2="180"/>
    <line x1="300" y1="180" x2="250" y2="210"/>
    <line x1="250" y1="210" x2="150" y2="210"/>
    <line x1="150" y1="210" x2="100" y2="180"/>
    <line x1="100" y1="180" x2="100" y2="100"/>
    <circle cx="150" cy="70" r="4" fill="#00f2fe"/>
    <circle cx="250" cy="70" r="4" fill="#00f2fe"/>
    <circle cx="300" cy="100" r="4" fill="#00f2fe"/>
    <circle cx="300" cy="180" r="4" fill="#00f2fe"/>
    <circle cx="250" cy="210" r="4" fill="#00f2fe"/>
    <circle cx="150" cy="210" r="4" fill="#00f2fe"/>
    <circle cx="100" cy="100" r="4" fill="#00f2fe"/>
    <circle cx="100" cy="180" r="4" fill="#00f2fe"/>
  </g>
  
  <!-- Originium Prismatic Black & Cyan Crystal -->
  <g filter="url(#glow-doctor)" transform="translate(200, 135)">
    <polygon points="0,-65 28,-15 0,65 -28,-15" fill="#0d1b2a" stroke="#00f2fe" stroke-width="2.5"/>
    <polygon points="0,-65 28,-15 0,0" fill="#1b263b" opacity="0.8"/>
    <polygon points="0,65 28,-15 0,0" fill="#4facfe" opacity="0.9"/>
    <polygon points="0,65 -28,-15 0,0" fill="#00f2fe" opacity="0.7"/>
    <polygon points="0,-65 -28,-15 0,0" fill="#0f4c81" opacity="0.8"/>
    
    <!-- Orbiting Energy Sparkles -->
    <circle cx="-45" cy="-30" r="2.5" fill="#ffffff"/>
    <circle cx="50" cy="20" r="3" fill="#00f2fe"/>
    <circle cx="-35" cy="40" r="2" fill="#4facfe"/>
  </g>
  
  <text x="200" y="260" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#4facfe" letter-spacing="3" text-anchor="middle">RESEARCH &amp; ANALYSIS</text>
</svg>