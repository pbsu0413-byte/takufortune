<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-captain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#191d47"/>
      <stop offset="100%" stop-color="#2d174d"/>
    </linearGradient>
    <radialGradient id="hyperion-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9b51e0" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#3498db" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-captain">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-captain)"/>
  <circle cx="200" cy="135" r="95" fill="url(#hyperion-glow)"/>
  
  <!-- Cosmic Bridge Navigation Compass & Stars -->
  <g stroke="#9b51e0" stroke-width="1.5" fill="none" filter="url(#glow-captain)">
    <circle cx="200" cy="135" r="60"/>
    <circle cx="200" cy="135" r="75" stroke-dasharray="10 8"/>
    <!-- Compass Rose -->
    <polygon points="200,60 206,125 200,135 194,125" fill="#3498db" stroke="none"/>
    <polygon points="200,210 206,145 200,135 194,145" fill="#9b51e0" stroke="none"/>
    <polygon points="125,135 190,129 200,135 190,141" fill="#3498db" stroke="none"/>
    <polygon points="275,135 210,129 200,135 210,141" fill="#9b51e0" stroke="none"/>
    <circle cx="200" cy="135" r="6" fill="#ffffff" stroke="none"/>
  </g>
  
  <!-- Warship Anchor & Hyperion Wings -->
  <path d="M140,80 Q200,50 260,80 Q200,100 140,80 Z" fill="#9b51e0" opacity="0.5" filter="url(#glow-captain)"/>
  <path d="M160,200 Q200,230 240,200 Q200,190 160,200 Z" fill="#3498db" opacity="0.6"/>
  
  <text x="200" y="265" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#3498db" letter-spacing="3" text-anchor="middle">HYPERION VOYAGE</text>
</svg>