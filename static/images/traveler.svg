<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-traveler" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1626"/>
      <stop offset="50%" stop-color="#1b2e4b"/>
      <stop offset="100%" stop-color="#2d2238"/>
    </linearGradient>
    <radialGradient id="teyvat-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe600" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-traveler">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-traveler)"/>
  <circle cx="200" cy="135" r="95" fill="url(#teyvat-glow)"/>
  
  <!-- 7 Element Orbits -->
  <circle cx="200" cy="135" r="78" fill="none" stroke="#ffe600" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.6"/>
  <circle cx="200" cy="135" r="56" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.5"/>
  
  <!-- Wings of Wind & Primogem Starlight Symbol -->
  <g filter="url(#glow-traveler)" transform="translate(200, 135)">
    <!-- Wings of Teyvat -->
    <path d="M0,-20 C-40,-50 -90,-20 -80,20 C-60,10 -30,0 0,10 Z" fill="#ffe600" opacity="0.8"/>
    <path d="M0,-20 C40,-50 90,-20 80,20 C60,10 30,0 0,10 Z" fill="#ffe600" opacity="0.8"/>
    <!-- Center Primogem Diamond -->
    <polygon points="0,-48 18,0 0,48 -18,0" fill="#ffffff" stroke="#00f0ff" stroke-width="2"/>
    <polygon points="0,-48 0,48 18,0" fill="#00f0ff" opacity="0.7"/>
    <circle cx="0" cy="0" r="5" fill="#ffe600"/>
  </g>
  
  <!-- 4 Floating Elemental Sparks -->
  <circle cx="130" cy="90" r="4" fill="#34d399" filter="url(#glow-traveler)"/>
  <circle cx="270" cy="90" r="4" fill="#f43f5e" filter="url(#glow-traveler)"/>
  <circle cx="140" cy="190" r="4" fill="#38bdf8" filter="url(#glow-traveler)"/>
  <circle cx="260" cy="190" r="4" fill="#a855f7" filter="url(#glow-traveler)"/>
  
  <text x="200" y="260" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffe600" letter-spacing="3" text-anchor="middle">TEYVAT TRAVELER</text>
</svg>